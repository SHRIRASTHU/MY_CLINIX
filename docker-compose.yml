services:
  postgres:
    image: postgres:16-alpine
    container_name: myclinix_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myclinix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myclinix_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-myclinix_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myclinix_user -d myclinix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
